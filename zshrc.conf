# --- History
HISTSIZE=100000
SAVEHIST=100000
setopt EXTENDED_HISTORY
setopt HIST_IGNORE_ALL_DUPS
setopt INC_APPEND_HISTORY
setopt SHARE_HISTORY

# --- Locale & editor
export LANG=en_US.UTF-8
export EDITOR='nvim'

# --- pyenv shims take priority over Homebrew's python3 (zprofile.conf puts
# /opt/homebrew/bin first; re-prioritize just the pyenv shims here)
export PATH="$PYENV_ROOT/shims:$PATH"

# --- Completion (picks up ~/.my-dot-files/completions/_kks etc.)
fpath=($HOME/.my-dot-files/completions $fpath)
autoload -U compinit && compinit
export HOMEBREW_NO_AUTO_UPDATE=0
export HOMEBREW_AUTO_UPDATE_SECS=2592000 # 30 days

eval $(thefuck --alias)
export SKIP_COVERAGE=1
